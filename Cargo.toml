[package]
name = "ffmpeg-web-rust"
version = "0.1.0"
edition = "2024"
# 仓库里还有两个自检工具（src/bin/ffmpeg_selftest.rs、store_selftest.rs），
# 不指定默认二进制的话 `cargo run` 会报「could not determine which binary to run」。
default-run = "ffmpeg-web-rust"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
fs4 = { version = "1.1.0", features = ["sync"] }
# 固定在 0.3.32：0.3.34 在 crates.io 上的 futures-macro 依赖不完整，无法解析
futures-util = "=0.3.32"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
rust-embed = { version = "8.13.0", features = ["compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# ⚠️ 不要加回 `macros`：它只提供 query!/query_as! 与 FromRow 派生宏，本项目
# 全部使用运行时的 sqlx::query(...) 并手写行映射（见 src/store/mod.rs），
# 而那个 proc-macro dylib 在本机 release 配置下会被链接成损坏的 Mach-O
# （dlopen 报 "mis-aligned LINKEDIT string pool"），导致 cargo build --release 必然失败。
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
