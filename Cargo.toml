[package]
name = "ffmpeg-web-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
fs4 = { version = "1.1.0", features = ["sync"] }
# 固定在 0.3.32：0.3.34 在 crates.io 上的 futures-macro 依赖不完整，无法解析
futures-util = "=0.3.32"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
rust-embed = { version = "8.13.0", features = ["compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
